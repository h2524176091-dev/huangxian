<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人物关系滑动门</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        body {
            background-color: red;
        }
        .box {
            width: 150px;
            margin: 30px;
        }
        .box > li {
            position: relative;
            background: #ffffff;
            margin-bottom: 3px;
        }
        .box > li > a {
            display: block;
            padding: 10px;
            color: #000;
            text-decoration: none;
            font-family: "微软雅黑";
        }
        .son {
            position: absolute;
            left: 150px;
            top: 0;
            width: 160px;
            background: #ffffff;
            transform: translateX(-10px);
            opacity: 0;
            transition: 0.3s;
        }
        .son li a {
            display: block;
            padding: 8px 10px;
            color: #000;
            text-decoration: none;
            font-family: "黑体";
        }
        .son li a:hover {
            background: #eee;
        }
        .box > li:hover .son {
            transform: translateX(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <ul class="box">
        <li>
            <a href=" ">主角</a >
            <ul class="son">
                <li><a href="#">父母</a ></li>
                <li><a href="#">兄弟姐妹</a ></li>
                <li><a href="#">祖辈</a ></li>
            </ul>
        </li>
        <li>
            <a href="#">朋友</a >
            <ul class="son">
                <li><a href="#">挚友</a ></li>
                <li><a href="#">普通好友</a ></li>
                <li><a href="#">玩伴</a ></li>
            </ul>
        </li>
        <li>
            <a href="#">师长</a >
            <ul class="son">
                <li><a href="#">班主任</a ></li>
                <li><a href="#">任课老师</a ></li>
                <li><a href="#">学长学姐</a ></li>
            </ul>
        </li>
    </ul>
</body>
</html>
